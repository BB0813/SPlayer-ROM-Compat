name: Android Release

on:
  push:
    tags:
      - v3.0.0-rc.*
      - v*
  workflow_dispatch:

jobs:
  android-apk:
    name: Build ${{ matrix.abi }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            script: android:apk:arm64
          - abi: armeabi-v7a
            script: android:apk:armeabi-v7a
          - abi: x86_64
            script: android:apk:x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode Android keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/release.jks

      - name: Build Android APK
        run: pnpm ${{ matrix.script }}
        env:
          SPLAYER_SIGNING_STORE_FILE: keystore/release.jks
          SPLAYER_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SPLAYER_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SPLAYER_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-ROM-Compat-${{ matrix.abi }}
          path: android/dist/apk/**/*.apk
