name: Android Release
run-name: Android Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"
      - "android-v*"
  workflow_dispatch:
    inputs:
      release_note:
        description: "本次 Android 构建备注"
        required: false
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: 22.x

jobs:
  android-split-apk:
    name: Build Android split APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag freshness
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          default_branch="${{ github.event.repository.default_branch }}"
          git fetch origin "$default_branch" --depth=1
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          branch_commit="$(git rev-parse "origin/$default_branch")"
          if [ "$tag_commit" != "$branch_commit" ]; then
            echo "::error::当前 tag 不在默认分支最新提交上，GitHub 预发布列表可能会按旧提交时间下排。请先把版本提交推到默认分支，再在最新提交上重新打 tag。"
            echo "tag commit: $tag_commit"
            echo "$default_branch commit: $branch_commit"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm lint

      - name: Validate Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 GitHub Actions Secret: $name"
              exit 1
            fi
          done

      - name: Decode Android keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p android/keystore
          sanitized_keystore_base64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"
          if ! printf '%s' "$sanitized_keystore_base64" | base64 --decode > android/keystore/release.jks; then
            echo "::error::ANDROID_KEYSTORE_BASE64 不是有效的 Base64，请重新复制 release.jks 的 Base64 内容"
            exit 1
          fi
          if [ ! -s android/keystore/release.jks ]; then
            echo "::error::release.jks 解码后为空，请检查 ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          keytool -list -keystore android/keystore/release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Ensure Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build arm64-v8a / armeabi-v7a / x86_64 APKs
        run: pnpm android:apk:all
        env:
          SPLAYER_SIGNING_STORE_FILE: keystore/release.jks
          SPLAYER_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SPLAYER_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SPLAYER_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify split APK outputs
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            count=$(find android/dist/apk/release -maxdepth 1 -type f -name "SPlayer-ROM-Compat-v*-${abi}-release.apk" | wc -l)
            if [ "$count" -lt 1 ]; then
              echo "::error::未找到 ${abi} 分架构 APK"
              find android/dist/apk/release -maxdepth 1 -type f -print || true
              exit 1
            fi
          done
          find android/dist/apk/release -maxdepth 1 -type f -name "SPlayer-ROM-Compat-v*-release.apk" -print

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-ROM-Compat-arm64-v8a
          path: android/dist/apk/release/SPlayer-ROM-Compat-v*-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-ROM-Compat-armeabi-v7a
          path: android/dist/apk/release/SPlayer-ROM-Compat-v*-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-ROM-Compat-x86_64
          path: android/dist/apk/release/SPlayer-ROM-Compat-v*-x86_64-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          release_dir="android/dist/apk/release"
          upload_dir="android/dist/apk/release-upload"
          mkdir -p "$upload_dir"
          rm -f "$upload_dir"/*.apk

          copy_latest_apk() {
            local abi="$1"
            local source_file
            source_file=$(find "$release_dir" -maxdepth 1 -type f -name "SPlayer-ROM-Compat-v*-${abi}-release.apk" | sort -V | tail -n 1)
            if [ -z "$source_file" ]; then
              echo "::error::未找到 ${abi} 分架构 APK"
              exit 1
            fi
            cp "$source_file" "$upload_dir/SPlayer-ROM-Compat-${GITHUB_REF_NAME}-${abi}.apk"
          }

          copy_latest_apk arm64-v8a
          copy_latest_apk armeabi-v7a
          copy_latest_apk x86_64
          find "$upload_dir" -maxdepth 1 -type f -name "*.apk" -print | sort

      - name: Publish Android GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SPlayer-ROM-Compat Android ${{ github.ref_name }}
          files: |
            android/dist/apk/release-upload/SPlayer-ROM-Compat-${{ github.ref_name }}-arm64-v8a.apk
            android/dist/apk/release-upload/SPlayer-ROM-Compat-${{ github.ref_name }}-armeabi-v7a.apk
            android/dist/apk/release-upload/SPlayer-ROM-Compat-${{ github.ref_name }}-x86_64.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          preserve_order: true
          make_latest: ${{ (contains(github.ref_name, '-rc.') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) && 'false' || 'true' }}
          prerelease: ${{ contains(github.ref_name, '-rc.') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body: |
            SPlayer-ROM-Compat Android 分架构签名包。

            产物说明：
            - 01 arm64-v8a：现代 Android / HarmonyOS 手机、平板推荐使用。
            - 02 armeabi-v7a：旧款 32 位 ARM 设备使用。
            - 03 x86_64：Android Studio 模拟器或 x86_64 环境测试使用。

            发布资产已按推荐顺序上传。桌面端 macOS / Windows / Linux 构建已改为手动 workflow，不会随 v* 标签自动运行。
